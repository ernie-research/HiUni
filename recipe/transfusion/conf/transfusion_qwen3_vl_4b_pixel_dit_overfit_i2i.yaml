# ============================================================================
# Pixel-DiT i2i edit overfit config
# ============================================================================
# Purpose:
#   - Verify Pixel-DiT edit training on a tiny i2i dataset.
#   - Use the same edit data layout as transfusion_qwen3_vl_4b_pretrain_i2i_vit.yaml:
#       ref image: ViT tokens
#       gen image: Pixel-DiT pixel-space diffusion target
#   - Keep CFG drop disabled by default to make the first overfit test easier to read.
#     Set cfg_drop_rate=0.1 later if you want to stress the edit CFG branches.
# ============================================================================

train:
  train_iters: 3000
  global_batch_size: 16
  micro_batch_size: 1
  eval_iters: 0
  eval_interval: 1000000

optimizer:
  lr: 0.0001
  min_lr: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.999
  weight_decay: 0.0
  adam_eps: 1e-8

scheduler:
  lr_warmup_iters: 10
  lr_decay_style: cosine

scheduler_config:
  shift: 1.0
  timestep_sampling: "shift_logit_norm"
  logit_norm_mu: 0.8
  logit_norm_sigma: 0.8
  use_loss_reweight: false
  use_dynamic_noise_scale: true
  dynamic_noise_ref_tokens: 256
  dynamic_noise_base_scale: 1.0

checkpoint:
  save: ./output/pixel_dit_overfit_i2i_vit
  pretrained_checkpoint: checkpoints-megatron/Qwen/Qwen3-VL-4B-Instruct
  save_interval: 1000
  dist_ckpt_strictness: "ignore_all"
  ckpt_convert_format: "float32"
  ckpt_convert_save: true
  # load: ./output/pixel_dit_overfit_i2i_vit
  # load_optim: true
  # finetune: false  # false=断点续训(继续迭代数), true=微调(迭代从0开始)
  # ckpt_step: 1000  # 加载指定步数 checkpoint

dist:
  use_megatron_fsdp: false
  use_torch_fsdp2: false

logger:
  log_interval: 1
  log_throughput: true
  tensorboard_dir: ./output/tb/pixel_dit_overfit_i2i_vit
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_throughput_to_tensorboard: true
  log_l2_norm_grad_to_tensorboard: true
  throughput_window_size: 10

dataset:
  # 256x256 ref ViT tokens + 256x256 gen pixel-DiT tokens + text/template.
  seq_length: 2048
  global_batch_size: 16
  micro_batch_size: 1
  packing_buffer_size: 50
  num_workers: 4
  path: ./output/test_wds_i2i

# ============================================================================
# Transfusion options: Pixel-DiT edit mode
# ============================================================================
transfusion:
  # predict_x0: true
  dit_block_adaln: false
  vit_recompute: true
  diffusion_head_recompute: true
  num_diffusion_layers: 10
  pixel_dit_gate_inject_layer: 3
  # Edit ref pixel gate ablation: none | shared | separate
  pixel_dit_ref_gate_mode: "none"
  dit_head_impl: "torch"
  edit_diff_loss_weight: 1.0  # editing diffusion loss 独立权重

  gen_min_pixels: 65536
  gen_max_pixels: 65536
  edit_min_pixels: 65536
  edit_max_pixels: 65536
  und_min_pixels: 65536
  und_max_pixels: 65536
  cfg_drop_rate: 0.0
  cfg_keep_chat_template: false  # false: edit full-uncond 使用纯 image-only 格式
  editing_encode_type: vit
  hf_path: ./checkpoints/Qwen3-VL-4B-Instruct

model:
  freeze_language_model: false
  use_flashmask: true
  freeze_vision_model: true
  freeze_vision_projection: true
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 2

rng:
  seed: 42

ddp:
  grad_reduce_in_fp32: true
  data_parallel_sharding_strategy: optim_grads
  overlap_grad_reduce: false
  overlap_param_gather: true

mixed_precision: "bf16_with_fp8_current_scaling_mixed"
